<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 475" role="img" aria-label="Aprovação antes da ação"><rect width="820" height="475" rx="14" fill="#f4f8fa"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#123448"><text x="410" y="31" font-size="22" font-weight="bold">Aprovação antes da ação</text><rect x="55" y="48" width="710" height="60" rx="9" fill="#e3f2f1" stroke="#087d83"/><text x="410" y="72" font-size="19" font-weight="bold">Agente prepara proposta</text><text x="410" y="92" font-size="15">Não publica diretamente</text><path d="M410 108v20 l-6 -7 m6 7 l6 -7" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="55" y="130" width="710" height="60" rx="9" fill="#fcebe7" stroke="#087d83"/><text x="410" y="154" font-size="19" font-weight="bold">Human review</text><text x="410" y="174" font-size="15">Revisor recebe ferramenta e parâmetros</text><path d="M410 190v20 l-6 -7 m6 7 l6 -7" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="55" y="212" width="710" height="60" rx="9" fill="#e9eefd" stroke="#087d83"/><text x="410" y="236" font-size="19" font-weight="bold">Decisão autorizada</text><text x="410" y="256" font-size="15">Negação encerra; aprovação segue para backend</text><path d="M410 272v20 l-6 -7 m6 7 l6 -7" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="55" y="294" width="710" height="60" rx="9" fill="#eaf4e9" stroke="#087d83"/><text x="410" y="318" font-size="19" font-weight="bold">Backend verifica versão</text><text x="410" y="338" font-size="15">Publicação somente da versão aprovada</text><path d="M410 354v20 l-6 -7 m6 7 l6 -7" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="55" y="376" width="710" height="60" rx="9" fill="#e3f2f1" stroke="#087d83"/><text x="410" y="400" font-size="19" font-weight="bold">Auditoria</text><text x="410" y="420" font-size="15">Guardar decisão, origem e resultado</text></g></svg>