<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Solicitações — demonstração</title><style>body{font:18px system-ui;max-width:600px;margin:70px auto;padding:20px}label,input,button{display:block;margin:12px 0}input{padding:10px}</style><h1>Formulário de cursos</h1><p>Prévia local. Não envia dados; a integração real exige backend autenticado.</p><form id="f"><label>Protocolo<input id="id" value="REQ-01" required></label><label>Curso<input id="curso" value="C001" required></label><button>Prévia do JSON</button></form><pre id="out"></pre><script>document.querySelector('#f').onsubmit=e=>{e.preventDefault();document.querySelector('#out').textContent=JSON.stringify({id:document.querySelector('#id').value,curso:document.querySelector('#curso').value},null,2)}</script></html>
