<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Solicitação de curso — Agente.IA</title><style>body{font:18px system-ui;color:#123747;max-width:640px;margin:55px auto;padding:20px;background:#f4fafb}form{background:white;border:1px solid #d6e2e4;padding:24px;border-radius:12px}label{display:block;margin:16px 0}input,button{font:inherit;padding:10px}input{display:block;width:95%}button{background:#087d83;color:white;border:none;border-radius:7px}pre{white-space:pre-wrap}</style><h1>Solicitação de curso</h1><p>Exercício com dados fictícios. O backend envia a solicitação ao n8n somente quando configurado.</p><form id="f"><label>Protocolo<input id="id" value="REQ-01" required></label><label>Curso<input id="curso" value="C001" required></label><button>Consultar workflow</button></form><pre id="out" aria-live="polite"></pre><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const out=document.querySelector('#out'); out.textContent='Enviando…';try{const r=await fetch('/api/solicitacoes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:document.querySelector('#id').value,curso:document.querySelector('#curso').value})});out.textContent=JSON.stringify(await r.json(),null,2)}catch{out.textContent='Servidor didático indisponível.'}}</script></html>
