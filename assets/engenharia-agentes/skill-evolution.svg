<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 488" role="img"><title>Evolução de skills / Skill evolution</title><rect width="740" height="488" rx="16" fill="#f5fafb"/><text x="370" y="29" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="21" fill="#14374a">Evolução de skills / Skill evolution</text><rect x="65" y="48" width="610" height="62" rx="10" fill="white" stroke="#087d83" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="72" font-weight="bold" font-size="20">Executar tarefa / Execute task</text><text x="370" y="93" font-size="15">Collect reproducible evidence</text></g><path d="M370 110 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#74939f" stroke-width="2"/><rect x="65" y="132" width="610" height="62" rx="10" fill="white" stroke="#087d83" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="156" font-weight="bold" font-size="20">Identificar aprendizado / Extract lessons</text><text x="370" y="177" font-size="15">Find a reusable procedure</text></g><path d="M370 194 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#74939f" stroke-width="2"/><rect x="65" y="216" width="610" height="62" rx="10" fill="white" stroke="#087d83" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="240" font-weight="bold" font-size="20">Propor alteração / Propose change</text><text x="370" y="261" font-size="15">Review the skill diff</text></g><path d="M370 278 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#74939f" stroke-width="2"/><rect x="65" y="300" width="610" height="62" rx="10" fill="white" stroke="#b7791f" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="324" font-weight="bold" font-size="20">Revisão e aprovação / Human review</text><text x="370" y="345" font-size="15">Accept or reject and version</text></g><path d="M370 362 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#74939f" stroke-width="2"/><rect x="65" y="384" width="610" height="62" rx="10" fill="white" stroke="#087d83" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="408" font-weight="bold" font-size="20">Reutilizar e testar / Reuse and test</text><text x="370" y="429" font-size="15">Regression tests in a new session</text></g><path d="M675 415 H710 V79 H675 l8 -6 m-8 6 l8 6" stroke="#087d83" stroke-width="2" fill="none" stroke-dasharray="6 4"/></svg>