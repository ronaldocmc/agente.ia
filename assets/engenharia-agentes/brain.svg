<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 488" role="img"><title>Cérebro do agente / Agent brain</title><rect width="740" height="488" rx="16" fill="#f5fafb"/><text x="370" y="29" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="21" fill="#14374a">Cérebro do agente / Agent brain</text><rect x="65" y="48" width="610" height="62" rx="10" fill="white" stroke="#087d83" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="72" font-weight="bold" font-size="20">Solicitação / Request</text><text x="370" y="93" font-size="15">Objetivo e identidade / Goal and identity</text></g><path d="M370 110 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#74939f" stroke-width="2"/><rect x="65" y="132" width="610" height="62" rx="10" fill="white" stroke="#087d83" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="156" font-weight="bold" font-size="20">Contexto + memória + skills</text><text x="370" y="177" font-size="15">Context, memory and procedural knowledge</text></g><path d="M370 194 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#74939f" stroke-width="2"/><rect x="65" y="216" width="610" height="62" rx="10" fill="white" stroke="#087d83" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="240" font-weight="bold" font-size="20">LLM + runtime</text><text x="370" y="261" font-size="15">Ciclo de decisão / Decision loop</text></g><path d="M370 278 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#74939f" stroke-width="2"/><rect x="65" y="300" width="610" height="62" rx="10" fill="white" stroke="#b7791f" stroke-width="2"/><g text-anchor="middle" font-family="Arial" fill="#14374a"><text x="370" y="324" font-weight="bold" font-size="20">Guardrails e autorização</text><text x="370" y="345" font-size="15">Policy and permission checks</text></g><path d="M370 362 v20 m-6 -7 l6 7 6 -7" fill="none" stroke="#74939f" stroke-width="2"/><rect x="65" y="384" w