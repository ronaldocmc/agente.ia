<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title"><title id="title">Observar.IA — coleta, curadoria e publicação</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#63838e"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f4f8fa"/><text x="500" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#173e50" text-anchor="middle">Observar.IA — coleta, curadoria e publicação</text><rect x="100" y="65" width="800" height="76" rx="12" fill="#173e50" stroke="#82a7b0"/><text x="500" y="94" fill="white" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Radar de fontes</text><text x="500" y="120" fill="white" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Firecrawl ou Crawl4AI — fontes permitidas e proveniência</text><path d="M500 141 V166" stroke="#63838e" stroke-width="2.5" marker-end="url(#a)"/><rect x="100" y="170" width="800" height="76" rx="12" fill="#e1eef1" stroke="#82a7b0"/><text x="500" y="199" fill="#173e50" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Verificação e memória</text><text x="500" y="225" fill="#173e50" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Verificador + Graphiti — fatos, datas, fontes e conflitos</text><path d="M500 246 V271" stroke="#63838e" stroke-width="2.5" marker-end="url(#a)"/><rect x="100" y="275" width="800" height="76" rx="12" fill="#e1eef1" stroke="#82a7b0"/><text x="500" y="304" fill="#173e50" font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">Curadoria humana</text><text x="500" y="330" fill="#173e50" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Aprovação pelo portal ou WhatsApp — negar publicação sem autorização</text><path d="M500 351 V376" stroke="#63838e" stroke-width="2.5"